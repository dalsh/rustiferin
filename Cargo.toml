[package]
name = "rustiferin"
version = "0.3.1"
edition = "2021"
description = "Rust-native ambient lighting agent for Glow Worm Luciferin firmware (Plasma Wayland + MQTT only)"
license = "GPL-3.0-or-later"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
arc-swap = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml_ng = "0.10"
url = "2"
itoa = "1"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# I/O boundaries, gated so the test binary doesn't need libpipewire/libdbus.
zbus = { version = "4", optional = true }
ashpd = { version = "0.9", default-features = false, features = ["tokio"], optional = true }
pipewire = { version = "0.9", optional = true }
rumqttc = { version = "0.25", optional = true }
ksni = { version = "0.3", optional = true }
nix = { version = "0.29", default-features = false, features = ["socket", "uio"], optional = true }
khronos-egl = { version = "6", features = ["static", "1_5"], optional = true }
gbm = { version = "0.15", default-features = false, optional = true }
glow = { version = "0.14", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.31", features = ["staging", "client"], optional = true }
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }

[features]
default = ["wayland", "mqtt", "tray", "kms"]
wayland = ["dep:zbus", "dep:ashpd", "dep:pipewire", "dep:wayland-client", "dep:wayland-protocols", "dep:futures-util"]
# Low-overhead KMS capture via gpu-screen-recorder's gsr-kms-server helper.
# nix: SCM_RIGHTS fd passing; khronos-egl + gbm: dma-buf import for readback.
# Runtime-depends on the gpu-screen-recorder package (optdepend).
kms = ["dep:nix", "dep:khronos-egl", "dep:gbm", "dep:glow"]
mqtt = ["dep:rumqttc"]
tray = ["dep:ksni"]
# Expose the test fakes (FakeCapture, ...) to integration tests and downstream
# crates without requiring `cfg(test)`. Off by default; tests opt in.
test-fakes = []

[dev-dependencies]
proptest = "1"
criterion = "0.5"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[[example]]
name = "portal_pipewire_smoke"
required-features = ["wayland"]

[[example]]
name = "output_smoke"
required-features = ["mqtt"]

[[example]]
name = "kms_probe"
required-features = ["kms"]

[[bench]]
name = "zones"
harness = false
